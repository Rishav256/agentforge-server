table:
  name: org_members
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
insert_permissions:
  - role: user
    permission:
      check:
        organization:
          org_members:
            role:
              _eq: owner
            user_id:
              _eq: X-Hasura-User-Id
      columns:
        - org_id
        - role
        - user_id
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - created_at
        - role
        - id
        - org_id
        - user_id
      filter:
        user_id:
          _eq: X-Hasura-User-Id
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - role
      filter:
        organization:
          org_members:
            role:
              _eq: owner
            user_id:
              _eq: X-Hasura-User-Id
      check:
        organization:
          org_members:
            role:
              _eq: owner
            user_id:
              _eq: X-Hasura-User-Id
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter:
        organization:
          org_members:
            role:
              _eq: owner
            user_id:
              _eq: X-Hasura-User-Id
    comment: ""
